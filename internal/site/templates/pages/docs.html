{{define "content"}}
<header class="fade-up">
  <p class="eyebrow">Documentation</p>
  <h1 class="page-title">Perk Workbench docs</h1>
  <p class="lede">Everything you need to install Perk Workbench, connect to data, work with queries, and extend the terminal-native workspace.</p>
</header>
<section class="mt-12 grid gap-4 sm:grid-cols-2" aria-label="Documentation topics">
  {{range .DocLinks}}
  <a class="card" href="{{.Path}}">
    <h2>{{.Title}}</h2>
    <p>{{.Summary}}</p>
  </a>
  {{end}}
</section>
{{end}}
