{{define "docs-sidebar"}}
<aside class="docs-sidebar" aria-label="Documentation sections">
  <p class="eyebrow mb-3">Documentation</p>
  <nav class="docs-sidebar-nav">
    <a href="/docs"{{if eq .Path "/docs"}} aria-current="page"{{end}}>Overview</a>
    {{range .DocLinks}}
    <a href="{{.Path}}"{{if eq $.Path .Path}} aria-current="page"{{end}}>{{.Title}}</a>
    {{end}}
    <button class="docs-sidebar-search" type="button" data-search-open>Search docs</button>
  </nav>
</aside>
{{end}}
