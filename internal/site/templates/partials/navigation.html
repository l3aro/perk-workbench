{{define "navigation"}}
<nav class="flex min-w-0 flex-wrap items-center gap-1 max-[30rem]:w-full lg:flex-1" aria-label="Primary">
  <a class="inline-block rounded-lg px-3 py-1.5 text-sm font-medium text-muted no-underline transition-colors duration-150 hover:bg-[color-mix(in_oklab,var(--color-line)_55%,transparent)] hover:text-ink [&[aria-current=page]]:bg-[color-mix(in_oklab,var(--color-accent)_14%,transparent)] [&[aria-current=page]]:text-ink" href="/"{{if eq .Path "/"}} aria-current="page"{{end}}>Home</a>
  <a class="inline-block rounded-lg px-3 py-1.5 text-sm font-medium text-muted no-underline transition-colors duration-150 hover:bg-[color-mix(in_oklab,var(--color-line)_55%,transparent)] hover:text-ink [&[aria-current=page]]:bg-[color-mix(in_oklab,var(--color-accent)_14%,transparent)] [&[aria-current=page]]:text-ink" href="/demo"{{if eq .Path "/demo"}} aria-current="page"{{end}}>Live Demo</a>
  <a class="inline-block rounded-lg px-3 py-1.5 text-sm font-medium text-muted no-underline transition-colors duration-150 hover:bg-[color-mix(in_oklab,var(--color-line)_55%,transparent)] hover:text-ink [&[aria-current=page]]:bg-[color-mix(in_oklab,var(--color-accent)_14%,transparent)] [&[aria-current=page]]:text-ink" href="/docs"{{if .Docs}} aria-current="page"{{end}}>Docs</a>

  </span>
