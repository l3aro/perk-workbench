name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "${files}" ]]; then
            printf 'Files need formatting:\n%s\n' "${files}"
            exit 1
          fi

      - name: Build
        run: go build ./cmd/perk-workbench-site
