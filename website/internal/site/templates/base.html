{{define "base"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Perk Workbench — a terminal UI for exploring databases.">
  <title>{{if .Title}}{{.Title}} · {{end}}Perk Workbench</title>
  <link rel="stylesheet" href="/static/site.css">
  <script src="/static/vendor/htmx-4.0.0-beta5.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    <aside class="site-rail">
      <div class="site-rail__brand"><a href="/">Perk Workbench</a></div>
      {{template "navigation" .}}
    </aside>
    <main class="site-main" id="main-content">
      {{block "content" .}}{{end}}
      <footer class="site-footer">
        <span>Perk Workbench</span>
        <span>Terminal-native database exploration</span>
      </footer>
    </main>
  </div>
</body>
</html>
{{end}}
