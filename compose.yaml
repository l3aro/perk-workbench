name: perk-workbench

services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ${DEMO_DIR:-./demo}/office-mysql.sql:/docker-entrypoint-initdb.d/office.sql:ro

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employees
    volumes:
      - ${DEMO_DIR:-./demo}/employees-postgres.sql.gz:/init-data/employees.sql.gz:ro
      - ${DEMO_DIR:-./demo}/init-employees.sh:/docker-entrypoint-initdb.d/init-employees.sh:ro

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: restaurants
    volumes:
      - mongo-data:/data/db
      - ${DEMO_DIR:-./demo}/restaurants.json:/demo/restaurants.json:ro
      - ${DEMO_DIR:-./demo}/init-restaurants.sh:/docker-entrypoint-initdb.d/init-restaurants.sh:ro
    healthcheck:
      # Unhealthy until the one-shot init import finishes seeding the
      # restaurants collection, so `make mongo` never opens an empty schema.
      test: ["CMD", "mongosh", "--quiet", "--eval", "const n = db.getSiblingDB('restaurants').restaurants.estimatedDocumentCount(); quit(n === 25359 ? 0 : 1)"]
      start_period: 20s
      interval: 5s
      timeout: 10s
      retries: 30

  dev:
    image: golang:1.25
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
      GOCACHE: /go/build-cache
      GOMODCACHE: /go/pkg/mod
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/workspace
      - ${DEMO_DIR:-./demo}:/demo
      - go-build-cache:/go/build-cache
      - go-mod-cache:/go/pkg/mod
    command: go run ./cmd/perk-workbench /demo/chinook-sqlite.db

volumes:
  go-build-cache:
  go-mod-cache:
  mongo-data:
