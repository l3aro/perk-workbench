name: Publish npm packages
# Manual preflight: configure npm trusted publishers, each bound to
# l3aro/perk-workbench and .github/workflows/npm-publish.yml, for:
# perk-workbench-darwin-arm64, perk-workbench-linux-x64,
# perk-workbench-linux-arm64, and perk-workbench-win32-x64.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and build frontend
        run: |
          npm install --include=optional --package-lock=false
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - run: node scripts/npm-publish.mjs --tag "${{ inputs.tag || github.ref_name }}"
