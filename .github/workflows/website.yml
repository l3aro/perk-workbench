name: Website

on:
  push:
    branches: ["**"]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - "go.work"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - "go.work"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The generated frontend bundles are gitignored. The server loads the
      # embedded manifest at startup, so build them before the Go test step.
      - name: Build frontend
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: website/go.sum

      - name: Test
        working-directory: website
        run: go test -race ./...

      - name: Vet
        working-directory: website
        run: go vet ./...

      - name: Check formatting
        working-directory: website
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "${files}" ]]; then
            printf 'Files need formatting:\n%s\n' "${files}"
            exit 1
          fi

      - name: Build
        working-directory: website
        run: go build ./cmd/perk-workbench-site
