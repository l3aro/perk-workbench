name: Test

on:
  push:
    branches: ["**"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "protocol/**"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "vite.config.mjs"
      - "Dockerfile"
      - "compose.yaml"
      - "demo/compose.yaml"
      - "Makefile"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "protocol/**"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "package-lock.json"
      - "vite.config.mjs"
      - "Dockerfile"
      - "compose.yaml"
      - "demo/compose.yaml"
      - "Makefile"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # The generated frontend bundles are gitignored. The server loads the
      # embedded manifest at startup, so build them before the Go test step.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go 1.27.0
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race ./cmd/... ./internal/...

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [[ -n "${files}" ]]; then
            printf 'Files need formatting:\n%s\n' "${files}"
            exit 1
          fi

      - name: Build perk-workbench
        run: go build ./cmd/perk-workbench

      - name: Build perk-workbench-site
        run: go build ./cmd/perk-workbench-site